<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jadwal Belajar / Study Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="toprow">
      <div>
        <div class="greet" id="greet"></div>
        <div class="dayname" id="dayname"></div>
        <div class="datestr" id="datestr"></div>
      </div>
      <div class="right-col">
        <div class="spill">
          <div class="snum" id="stn">0</div>
          <div class="slbl" id="slbl-streak">HARI 🔥</div>
          <div class="srec" id="srec"></div>
        </div>
        <div class="lang-toggle">
          <button class="ltab on" id="lt-id" onclick="setLang('id')">ID</button>
          <button class="ltab" id="lt-en" onclick="setLang('en')">EN</button>
        </div>
        <button class="authbtn" id="authbtn" onclick="doAuth()">
          <div class="auth-av" id="auth-av">?</div>
          <div class="auth-tx" id="auth-tx">SIGN IN</div>
        </button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="sc"><div class="scn" id="sw">0</div><div class="scl" id="lbl-week">minggu ini</div></div>
    <div class="sc"><div class="scn" id="sm">0</div><div class="scl" id="lbl-month">bulan ini</div></div>
    <div class="sc"><div class="scn" id="stot">0</div><div class="scl" id="lbl-total">total</div></div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-today" onclick="showTab('today',this)"></button>
    <button class="tab" id="tab-week" onclick="showTab('week',this)"></button>
    <button class="tab" id="tab-kur" onclick="showTab('kur',this)"></button>
    <button class="tab" id="tab-ist" onclick="showTab('ist',this)"></button>
    <button class="tab" id="tab-hist" onclick="showTab('hist',this)"></button>
  </div>

  <div class="px sec show" id="sec-today">
    <div class="slabel" id="lbl-must45"></div>

    <div class="mcard ready" id="mc" role="button" tabindex="0" aria-pressed="false"
         onclick="toggleMust()"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMust();}">
      <div class="cbtn" id="cb">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M4 11L9 16.5L18 5.5" stroke="#111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="mbody">
        <div class="mname" id="mn"></div>
        <div class="msub" id="msub"></div>
        <span class="mpill" id="mp"></span>
      </div>
      <div class="marr">›</div>
    </div>

    <div class="slabel" id="lbl-ist"></div>

    <div class="icard ready" id="ic" role="button" tabindex="0" aria-pressed="false"
         onclick="toggleTermToday()"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTermToday();}">
      <div class="ihead">
        <div class="cbtn small" id="icb">
          <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
            <path d="M4 11L9 16.5L18 5.5" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="ihbd">
          <div class="iname2" id="in"></div>
          <div class="ialt" id="ialt"></div>
        </div>
        <span class="mpill" id="ip"></span>
      </div>
      <div class="idef" id="idef"></div>
    </div>

    <div class="pcard">
      <div class="prow">
        <div class="ptitle" id="lbl-progress"></div>
        <div class="pval" id="pv">0/7</div>
      </div>
      <div class="ptrack"><div class="pfill" id="pf" style="width:0%"></div></div>
    </div>

    <div class="pcard">
      <div class="prow">
        <div class="ptitle" id="lbl-kprogress"></div>
        <div class="pval" id="kpv">0/0</div>
      </div>
      <div class="ptrack"><div class="pfill" id="kpf" style="width:0%"></div></div>
    </div>

    <div class="pcard">
      <div class="prow">
        <div class="ptitle" id="lbl-iprogress"></div>
        <div class="pval" id="ipv">0/0</div>
      </div>
      <div class="ptrack"><div class="pfill" id="ipf" style="width:0%"></div></div>
    </div>

    <div class="slabel" id="lbl-blocks"></div>
    <div class="blist" id="blks"></div>

    <button class="nbtn" onclick="doNotif()">
      <div class="nico">🔔</div>
      <div class="nbd">
        <div class="ntitle" id="nt"></div>
        <div class="nsub">06.00 · 09.00 · 12.00 · 15.00 · 18.00</div>
      </div>
      <div class="narr">›</div>
    </button>
  </div>

  <div class="px sec" id="sec-week">
    <div class="slabel" id="lbl-thisweek"></div>
    <div class="wstrip" id="wr"></div>
    <div class="lcard" id="wlist"></div>
  </div>

  <div class="px sec" id="sec-kur">
    <div class="slabel" id="lbl-kur"></div>
    <div class="kurhead">
      <div class="kursub" id="kur-sub"></div>
      <div class="kurcount" id="kur-count"></div>
    </div>
    <div id="kurlist"></div>
  </div>

  <div class="px sec" id="sec-ist">
    <div class="slabel" id="lbl-istilah"></div>
    <div class="kurhead">
      <div class="kursub" id="ist-sub"></div>
      <div class="kurcount" id="ist-count"></div>
    </div>
    <div id="istlist"></div>
  </div>

  <div class="px sec" id="sec-hist">
    <div class="slabel" id="lbl-history"></div>
    <div class="lcard" id="hlist"></div>
  </div>

</div>

<script src="curriculum.js"></script>
<script src="terms.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
