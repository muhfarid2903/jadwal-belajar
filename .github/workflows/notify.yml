name: Daily Notifications

on:
  schedule:
    - cron: '0 23 * * *'  # 06:00 WIB
    - cron: '0 2 * * *'   # 09:00 WIB
    - cron: '0 5 * * *'   # 12:00 WIB
    - cron: '0 8 * * *'   # 15:00 WIB
    - cron: '0 11 * * *'  # 18:00 WIB
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot (0-4) untuk test manual'
        required: false
        default: '0'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install firebase-admin@12

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "idx=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 23 * * *") echo "idx=0" >> $GITHUB_OUTPUT ;;
              "0 2 * * *")  echo "idx=1" >> $GITHUB_OUTPUT ;;
              "0 5 * * *")  echo "idx=2" >> $GITHUB_OUTPUT ;;
              "0 8 * * *")  echo "idx=3" >> $GITHUB_OUTPUT ;;
              "0 11 * * *") echo "idx=4" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Send push notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLOT: ${{ steps.slot.outputs.idx }}
        run: node send-notification.js
