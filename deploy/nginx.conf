# Konfigurasi nginx di dalam container; akar webnya adalah hasil git clone
# yang dipasang read-only di /srv/site.

server {
  listen 80;
  server_name _;
  root /srv/site;
  index index.html;

  # Semua aset app disajikan no-cache, menyamai header di firebase.json:
  # service worker dan berkas JS harus selalu divalidasi ke server supaya
  # pembaruan langsung terpakai dan index.html baru tidak pernah berpasangan
  # dengan app.js lama. Berkasnya kecil, jadi biayanya tidak berarti.
  add_header Cache-Control "no-cache" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Isi repo yang bukan bagian dari situs: konfigurasi Firebase, aturan
  # Firestore, skrip pengirim notifikasi (dijalankan GitHub Actions), berkas
  # deploy ini sendiri, serta .git dan berkas tersembunyi lainnya.
  location ~ ^/(deploy/|firebase\.json|firestore\.rules|send-notification\.js|README\.md) {
    return 404;
  }
  location ~ /\. {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
