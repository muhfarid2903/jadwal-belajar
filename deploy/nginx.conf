# Konfigurasi nginx di dalam container; akar webnya adalah hasil git clone
# yang dipasang read-only di /srv/site.

server {
  listen 80;
  server_name _;
  root /srv/site;
  index index.html;

  # Semua aset app disajikan no-cache: service worker dan berkas JS harus selalu
  # divalidasi ke server supaya pembaruan langsung terpakai dan index.html baru
  # tidak pernah berpasangan dengan app.js lama. Berkasnya kecil, jadi biayanya
  # tidak berarti.
  add_header Cache-Control "no-cache" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Isi repo yang bukan bagian dari situs: kode server, berkas deploy (termasuk
  # deploy/.env dan basis data di deploy/data/), dokumentasi, serta .git dan
  # berkas tersembunyi lainnya.
  #
  # Catatan: /api tidak pernah sampai ke nginx — Traefik mengarahkannya ke
  # container API lebih dulu lewat router ber-priority lebih tinggi.
  location ~ ^/(deploy/|server/|README\.md) {
    return 404;
  }
  location ~ /\. {
    return 404;
  }

  # Sengaja TIDAK jatuh ke /index.html: app ini satu halaman tanpa routing sisi
  # client, jadi fallback semacam itu hanya membuat berkas yang tidak ada
  # membalas 200 berisi HTML — aset yang hilang atau salah nama jadi tersamar,
  # dan service worker lama bisa menerima HTML saat meminta berkas JS.
  location / {
    try_files $uri $uri/ =404;
  }
}
