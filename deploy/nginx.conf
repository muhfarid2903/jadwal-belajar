# Konfigurasi nginx di dalam container; akar webnya adalah hasil git clone
# yang dipasang read-only di /srv/site.

server {
  listen 80;
  server_name _;
  root /srv/site;
  index index.html;

  # Semua aset app disajikan no-cache, menyamai header di firebase.json:
  # service worker dan berkas JS harus selalu divalidasi ke server supaya
  # pembaruan langsung terpakai dan index.html baru tidak pernah berpasangan
  # dengan app.js lama. Berkasnya kecil, jadi biayanya tidak berarti.
  add_header Cache-Control "no-cache" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Isi repo yang bukan bagian dari situs: kode server, berkas deploy (termasuk
  # deploy/.env dan basis data di deploy/data/), konfigurasi Firebase yang masih
  # tersisa, serta .git dan berkas tersembunyi lainnya.
  #
  # Catatan: /api tidak pernah sampai ke nginx — Traefik mengarahkannya ke
  # container API lebih dulu lewat router ber-priority lebih tinggi.
  location ~ ^/(deploy/|server/|firebase\.json|firestore\.rules|send-notification\.js|README\.md) {
    return 404;
  }
  location ~ /\. {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
