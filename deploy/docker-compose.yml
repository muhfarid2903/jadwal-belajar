# Hosting statis untuk belajar.balanglompo.com di VPS.
#
# VPS itu menjalankan Coolify, dan Traefik (container `coolify-proxy`) yang
# memegang port 80/443 sekaligus mengurus sertifikat Let's Encrypt. Jadi
# container ini TIDAK boleh membuka port ke host — ia hanya bicara HTTP di
# port 80 lewat jaringan `coolify`, dan Traefik yang meneruskan trafik ke
# sini berdasarkan label di bawah. Polanya sama dengan jurnal-balanglompo
# yang sudah jalan di server itu.
#
# Direktori induk (hasil git clone) dipasang read-only sebagai akar web, jadi
# memperbarui situs cukup `git pull` — tanpa rebuild atau restart container.
#
#   pasang : git clone https://github.com/muhfarid2903/jadwal-belajar.git /opt/jadwal-belajar
#            cd /opt/jadwal-belajar/deploy && docker compose up -d
#   update : git -C /opt/jadwal-belajar pull

services:
  jadwal-belajar:
    image: nginx:alpine
    container_name: jadwal-belajar
    restart: unless-stopped
    volumes:
      - ../:/srv/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify
      # HTTP hanya untuk tantangan ACME dan pengalihan ke HTTPS.
      traefik.http.routers.jadwal-belajar-http.entrypoints: http
      traefik.http.routers.jadwal-belajar-http.rule: Host(`belajar.balanglompo.com`)
      traefik.http.routers.jadwal-belajar-http.middlewares: jadwal-belajar-redirect
      traefik.http.middlewares.jadwal-belajar-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.jadwal-belajar-redirect.redirectscheme.permanent: 'true'
      traefik.http.routers.jadwal-belajar.entrypoints: https
      traefik.http.routers.jadwal-belajar.rule: Host(`belajar.balanglompo.com`)
      traefik.http.routers.jadwal-belajar.tls: 'true'
      traefik.http.routers.jadwal-belajar.tls.certresolver: letsencrypt
      traefik.http.services.jadwal-belajar.loadbalancer.server.port: '80'

networks:
  coolify:
    external: true
